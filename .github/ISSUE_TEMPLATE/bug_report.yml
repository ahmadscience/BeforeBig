name: Bug report
description: Report a reproducible problem using redacted or fictional data.
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, cookies, emails, or private moderation evidence. For vulnerabilities, read SECURITY.md."
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the page and minimal steps using fictional data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node/pnpm versions, browser, and offline fixtures or your own database. Do not paste environment values.
    validations:
      required: true
